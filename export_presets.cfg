html/head_include="<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='theme-color' content='#0a0909'>
<style>
html, body { background: #0a0909; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#rotate-hint { display: none; position: fixed; inset: 0; z-index: 1000; background: #0a0909; color: #efe3c8; font-family: Georgia, serif; letter-spacing: 0.14em; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
@media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
</style>
<script>
// Phones and tablets: fullscreen + landscape lock on the first tap (browsers only allow both
// inside a user gesture), and a 'rotate your device' card while held in portrait.
(function () {
	var done = false;
	function goFull() {
		if (done || !((navigator.maxTouchPoints || 0) > 0)) { return; }
		done = true;
		var el = document.documentElement;
		var req = el.requestFullscreen || el.webkitRequestFullscreen;
		var lock = function () { if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function () {}); } };
		try {
			var p = req ? req.call(el, { navigationUI: 'hide' }) : null;
			if (p && p.then) { p.then(lock).catch(function () {}); } else { lock(); }
		} catch (e) {}
	}
	window.addEventListener('touchend', goFull, { passive: true });
	document.addEventListener('DOMContentLoaded', function () {
		var d = document.createElement('div');
		d.id = 'rotate-hint';
		d.innerHTML = '<div style=\"font-size:46px;margin-bottom:16px\">&#x21bb;</div><div>ROTATE YOUR DEVICE</div><div style=\"opacity:.6;font-size:13px;margin-top:10px;letter-spacing:.06em\">The Four Nations is played in landscape</div>';
		document.body.appendChild(d);
	});
})();
</script>"
